# 100 коммерческих факторов Яндекса — структурированный справочник
# Источник: https://docs.google.com/spreadsheets/d/1pycFLxR8jhiB2q6Vm_CxfNkmMkQ_Ej1evqsDJKFyJMM/
# Обновлено: 2026-04-17
#
# Поля:
#   id           — порядковый номер
#   category     — одна из 7 категорий (см. ниже)
#   name         — краткое название фактора
#   check_type   — как проверять: text_contains | url_exists | element_exists | structured_data | http_status | manual
#   patterns     — ключевые слова/селекторы/паттерны для автоматической проверки
#   pages        — на каких страницах искать (home, contacts, about, delivery, catalog, product)
#   description  — пояснение что проверяем и зачем
#   severity     — critical | high | medium | low
#
# Категории:
#   1. navigation_company  — Навигация и информация о компании
#   2. trust               — Доверие (сертификаты, отзывы, социальные доказательства)
#   3. ecommerce           — E-commerce (корзина, доставка, оплата, гарантия)
#   4. engagement          — Customer engagement (callback, чат, соцсети, формы)
#   5. content_seo         — Content и SEO (контент, HTTPS, адаптивность)
#   6. sales_tools         — Sales tools (скидки, акции, УТП, кросс-сейл)
#   7. product_info        — Product info (описания, фото, отзывы товаров)

factors:
  # ============================================================
  # КАТЕГОРИЯ 1: НАВИГАЦИЯ И КОМПАНИЯ
  # ============================================================
  - id: 1
    category: navigation_company
    name: "История компании"
    check_type: text_contains
    patterns: ["история компани", "о компани", "о нас", "about", "о бренде"]
    pages: [home, about]
    description: "Описаны этапы развития компании, рост, увеличение товарных предложений"
    severity: medium

  - id: 2
    category: navigation_company
    name: "Информация о персонале"
    check_type: text_contains
    patterns: ["команда", "сотрудник", "наши специалисты", "персонал", "staff", "team"]
    pages: [home, about]
    description: "Информация о сотрудниках, работающих в компании, их опыте, достижениях"
    severity: medium

  - id: 3
    category: navigation_company
    name: "Структура сайта"
    check_type: element_exists
    patterns: ["nav", "header nav", ".menu", ".navigation", "menu"]
    pages: [home]
    description: "У сайта есть проработанная структура навигации"
    severity: high

  - id: 4
    category: navigation_company
    name: "Оборудование, техника, материалы"
    check_type: text_contains
    patterns: ["оборудован", "материал", "техник", "производств", "цех"]
    pages: [home, about]
    description: "Блок-схема структуры компании, отделы, департаменты, бизнес-процессы, используемое оборудование"
    severity: low

  - id: 5
    category: navigation_company
    name: "Вакансии"
    check_type: url_exists
    patterns: ["/vacancies", "/careers", "/jobs", "/rabota", "вакансии", "карьера"]
    pages: [home]
    description: "Раздел с вакансиями"
    severity: low

  - id: 6
    category: navigation_company
    name: "Партнеры"
    check_type: text_contains
    patterns: ["партнер", "поставщик", "partners"]
    pages: [home, about]
    description: "Кто является партнером компании, поставщики"
    severity: medium

  - id: 7
    category: navigation_company
    name: "Контакты и обратная связь"
    check_type: url_exists
    patterns: ["/contacts", "/kontakty", "/contact", "контакты"]
    pages: [home]
    description: "Полные контакты с индексом, больше упоминаний на сайте"
    severity: critical

  - id: 8
    category: navigation_company
    name: "Телефон в шапке"
    check_type: element_exists
    patterns: ["header a[href^='tel:']", "a[href^='tel:']"]
    pages: [home]
    description: "Обязательное упоминание в шапке сайта, на странице Контакты и в футере"
    severity: critical

  - id: 9
    category: navigation_company
    name: "Реквизиты"
    check_type: text_contains
    patterns: ["реквизит", "ИНН", "ОГРН", "КПП", "юридический адрес", "юр. адрес"]
    pages: [contacts, about]
    description: "Раздел с реквизитами компании"
    severity: high

  - id: 10
    category: navigation_company
    name: "Филиалы"
    check_type: text_contains
    patterns: ["филиал", "наши офисы", "отделени", "branches"]
    pages: [contacts, home]
    description: "Контакты всех филиалов. Можно со структурой, персоналом"
    severity: medium

  - id: 11
    category: navigation_company
    name: "Представители"
    check_type: text_contains
    patterns: ["представител", "дилер", "региональные менеджеры", "дистрибьютор"]
    pages: [contacts, about]
    description: "Представители компании в других регионах, странах"
    severity: low

  - id: 12
    category: navigation_company
    name: "Новости"
    check_type: url_exists
    patterns: ["/news", "/novosti", "/blog/news", "новости"]
    pages: [home]
    description: "Раздел со свежими новостями компании"
    severity: medium

  - id: 13
    category: navigation_company
    name: "Портфолио"
    check_type: url_exists
    patterns: ["/portfolio", "/works", "/projects", "/cases", "портфолио", "кейсы", "работы"]
    pages: [home]
    description: "Раздел с примерами работ, товаров, продукции"
    severity: medium

  - id: 14
    category: navigation_company
    name: "Оптовикам"
    check_type: url_exists
    patterns: ["/opt", "/wholesale", "/optom", "оптом", "оптовикам", "dealers"]
    pages: [home]
    description: "Раздел с информацией по работе с оптовыми клиентами, партнерами"
    severity: low

  - id: 15
    category: navigation_company
    name: "Корпоративным клиентам"
    check_type: url_exists
    patterns: ["/corporate", "/b2b", "/business", "корпоративн", "юрлицам"]
    pages: [home]
    description: "Раздел с информацией для корпоративных клиентов"
    severity: low

  - id: 16
    category: navigation_company
    name: "График работы"
    check_type: text_contains
    patterns: ["график работы", "режим работы", "часы работы", "пн-пт", "working hours", "круглосуточно"]
    pages: [home, contacts]
    description: "Детальная информация по графику работы компании, основного офиса, филиалов"
    severity: high

  - id: 17
    category: navigation_company
    name: "Слоган"
    check_type: manual
    patterns: []
    pages: [home]
    description: "Наличие слогана в шапке сайта, желательно в левом верхнем углу"
    severity: low

  - id: 18
    category: navigation_company
    name: "Логотип"
    check_type: element_exists
    patterns: ["header img", "header .logo", ".logo img", "[class*='logo'] img", "a[href='/'] img"]
    pages: [home]
    description: "Наличие логотипа в шапке сайта, желательно в левом верхнем углу"
    severity: critical

  - id: 19
    category: navigation_company
    name: "Выбор региона"
    check_type: text_contains
    patterns: ["ваш город", "выбор города", "ваш регион", "город доставки", "выберите регион"]
    pages: [home]
    description: "Если работаете в нескольких регионах и есть поддомены — добавить выбор нужного региона"
    severity: medium

  - id: 20
    category: navigation_company
    name: "Телефоны — региональный/8-800"
    check_type: text_contains
    patterns: ["8 800", "8-800", "8(800)", "+7 800"]
    pages: [home, contacts]
    description: "Региональный или бесплатный 8-800. Мобильный лучше не использовать"
    severity: medium

  - id: 21
    category: navigation_company
    name: "Поиск по сайту"
    check_type: element_exists
    patterns: ["input[type='search']", "[class*='search'] input", "form[role='search']"]
    pages: [home]
    description: "Наличие формы поиска на видном месте"
    severity: high

  - id: 22
    category: navigation_company
    name: "Email в контактах"
    check_type: element_exists
    patterns: ["a[href^='mailto:']"]
    pages: [home, contacts]
    description: "Email-адрес для связи"
    severity: high

  # ============================================================
  # КАТЕГОРИЯ 2: ДОВЕРИЕ (сертификаты, отзывы, репутация)
  # ============================================================
  - id: 23
    category: trust
    name: "Отзывы, рекомендации, благодарности"
    check_type: url_exists
    patterns: ["/reviews", "/otzyvy", "/testimonials", "отзывы", "рекомендации"]
    pages: [home]
    description: "Раздел с отзывами и рекомендациями"
    severity: high

  - id: 24
    category: trust
    name: "Наши клиенты"
    check_type: text_contains
    patterns: ["наши клиенты", "clients", "с нами работают", "нам доверяют"]
    pages: [home, about]
    description: "Информация о клиентах компании (логотипы, кейсы)"
    severity: medium

  - id: 25
    category: trust
    name: "Сертификаты и лицензии"
    check_type: url_exists
    patterns: ["/certificates", "/litsenzii", "/sertifikaty", "сертификат", "лицензи"]
    pages: [home, about]
    description: "Раздел-галерея с фотографиями и сканами официальных документов"
    severity: high

  - id: 26
    category: trust
    name: "Достижения"
    check_type: text_contains
    patterns: ["достижения", "награды", "премии", "грамоты", "патенты", "publications"]
    pages: [home, about]
    description: "Раздел с фотографиями грамот, достижений, патентов, публикаций"
    severity: medium

  - id: 27
    category: trust
    name: "Видимость в интернете (соцсети)"
    check_type: element_exists
    patterns: ["a[href*='vk.com']", "a[href*='t.me']", "a[href*='instagram']", "a[href*='youtube']", "a[href*='ok.ru']", "a[href*='dzen']"]
    pages: [home]
    description: "Активные страницы компании во всех соцсетях"
    severity: high

  - id: 28
    category: trust
    name: "Преимущества"
    check_type: text_contains
    patterns: ["наши преимущества", "почему мы", "почему выбирают", "why us", "advantages"]
    pages: [home]
    description: "Наличие блока Наши преимущества"
    severity: high

  - id: 29
    category: trust
    name: "Элементы доверия"
    check_type: text_contains
    patterns: ["visa", "mastercard", "мир", "сбербанк", "тинькофф", "робокасса", "яндекс касса", "юкасса"]
    pages: [home]
    description: "Размещение логотипов авторитетных сервисов (платежные системы, партнеры)"
    severity: medium

  - id: 30
    category: trust
    name: "Виджет карты и схема проезда"
    check_type: element_exists
    patterns: ["iframe[src*='yandex']", "iframe[src*='maps']", "[class*='map']", "#map"]
    pages: [contacts]
    description: "Схема проезда по актуальному адресу компании"
    severity: high

  - id: 31
    category: trust
    name: "Корпоративный блог"
    check_type: url_exists
    patterns: ["/blog", "/articles", "/статьи", "блог", "журнал"]
    pages: [home]
    description: "В блоге актуальная, регулярно обновляющаяся информация"
    severity: medium

  - id: 32
    category: trust
    name: "Фото и видео-отчёты"
    check_type: text_contains
    patterns: ["фото отчет", "видео отчет", "фотоотчет", "видеоотчет", "отчет о работе"]
    pages: [home]
    description: "Фото и/или видео-отчеты по каждой услуге"
    severity: low

  - id: 33
    category: trust
    name: "Видеообращение директора"
    check_type: manual
    patterns: []
    pages: [home, about]
    description: "Видеообращение руководителя повышает доверие клиента"
    severity: low

  - id: 34
    category: trust
    name: "Отсутствие сторонней рекламы"
    check_type: manual
    patterns: []
    pages: [home]
    description: "Сайт должен продавать свой товар, без баннеров чужих компаний"
    severity: high

  - id: 35
    category: trust
    name: "Видео / канал на YouTube"
    check_type: element_exists
    patterns: ["a[href*='youtube.com']", "iframe[src*='youtube']", "iframe[src*='rutube']", "iframe[src*='vkvideo']"]
    pages: [home, about]
    description: "Наличие видео-роликов или собственного канала"
    severity: low

  - id: 36
    category: trust
    name: "Репутация и возраст домена"
    check_type: manual
    patterns: []
    pages: []
    description: "Работа по репутации на сторонних сайтах отзывов о компании"
    severity: high

  - id: 37
    category: trust
    name: "Яндекс Справочник / Google Мой Бизнес"
    check_type: manual
    patterns: []
    pages: []
    description: "Компания зарегистрирована в справочниках (ручная проверка)"
    severity: critical

  - id: 38
    category: trust
    name: "Сервисы Яндекса"
    check_type: manual
    patterns: []
    pages: []
    description: "Участие в сервисах Яндекса (Маркет, Дзен, Карты, Услуги)"
    severity: medium

  - id: 39
    category: trust
    name: "Узнаваемость бренда"
    check_type: manual
    patterns: []
    pages: []
    description: "Упоминания названия бренда в интернете, особенно СМИ + брендованный трафик"
    severity: high

  - id: 40
    category: trust
    name: "Отзывы на отзовиках"
    check_type: manual
    patterns: []
    pages: []
    description: "Отзывы на сторонних сайтах (flamp.ru, otzovik.com, yandex отзывы)"
    severity: high

  - id: 41
    category: trust
    name: "Отзывы на агрегаторах"
    check_type: manual
    patterns: []
    pages: []
    description: "Отзывы на агрегаторах (Яндекс.Маркет, Ozon, Wildberries)"
    severity: medium

  - id: 42
    category: trust
    name: "Ссылки на авторитетных ресурсах"
    check_type: manual
    patterns: []
    pages: []
    description: "Работа по простановке ссылок с авторитетных ресурсов"
    severity: medium

  - id: 43
    category: trust
    name: "Упоминания бренда на форумах"
    check_type: manual
    patterns: []
    pages: []
    description: "Работа над упоминаниями бренда в интернете"
    severity: low

  # ============================================================
  # КАТЕГОРИЯ 3: E-COMMERCE (корзина, доставка, оплата, гарантия)
  # ============================================================
  - id: 44
    category: ecommerce
    name: "Калькулятор стоимости"
    check_type: text_contains
    patterns: ["калькулятор", "рассчитать стоимость", "calculator", "расчет стоимости"]
    pages: [home]
    description: "Онлайн расчет стоимости услуг, товаров, доставки"
    severity: medium

  - id: 45
    category: ecommerce
    name: "Сравнение товаров"
    check_type: text_contains
    patterns: ["сравнить", "сравнение", "compare"]
    pages: [catalog, product]
    description: "Возможность сравнить товары"
    severity: low

  - id: 46
    category: ecommerce
    name: "Прайс-лист (скачать)"
    check_type: text_contains
    patterns: ["скачать прайс", "прайс-лист", "price list", "скачать каталог", ".pdf", ".xlsx", ".xls"]
    pages: [home]
    description: "Возможность скачать прайс-лист в удобном формате"
    severity: medium

  - id: 47
    category: ecommerce
    name: "Сервис и ремонт"
    check_type: text_contains
    patterns: ["сервис", "ремонт", "обслуживание", "гарантийный ремонт"]
    pages: [home]
    description: "Осуществляется ли обслуживание/ремонт компанией, условия"
    severity: low

  - id: 48
    category: ecommerce
    name: "Обслуживание клиента"
    check_type: text_contains
    patterns: ["персональный менеджер", "горячая линия", "бесплатный телефон", "консультация бесплатно"]
    pages: [home]
    description: "Персональный менеджер, бесплатный телефон горячей линии"
    severity: medium

  - id: 49
    category: ecommerce
    name: "Доставка"
    check_type: url_exists
    patterns: ["/delivery", "/dostavka", "/shipping", "доставка"]
    pages: [home]
    description: "Описаны условия доставки и возможные варианты"
    severity: critical

  - id: 50
    category: ecommerce
    name: "Условия оферты"
    check_type: text_contains
    patterns: ["оферт", "договор оферты", "публичная оферта", "пользовательское соглашение"]
    pages: [home]
    description: "Описание договора публичной оферты"
    severity: high

  - id: 51
    category: ecommerce
    name: "FAQ"
    check_type: url_exists
    patterns: ["/faq", "/voprosy", "/help", "faq", "вопрос-ответ", "частые вопросы"]
    pages: [home]
    description: "Подробный раздел вопрос-ответ"
    severity: medium

  - id: 52
    category: ecommerce
    name: "Франчайзинг"
    check_type: url_exists
    patterns: ["/franchise", "/franchising", "франшиз", "franchise"]
    pages: [home]
    description: "Возможность представления франшизы"
    severity: low

  - id: 53
    category: ecommerce
    name: "Гарантии, возврат, оплата"
    check_type: text_contains
    patterns: ["гарантия", "возврат", "способы оплаты", "warranty", "refund"]
    pages: [home]
    description: "Подробно описано что гарантируем и способы возврата"
    severity: high

  - id: 54
    category: ecommerce
    name: "Личный кабинет"
    check_type: url_exists
    patterns: ["/login", "/personal", "/cabinet", "/account", "личный кабинет", "войти"]
    pages: [home]
    description: "С информацией по бонусам, истории покупок"
    severity: medium

  - id: 55
    category: ecommerce
    name: "Ссылка на корзину в шапке"
    check_type: element_exists
    patterns: ["header a[href*='cart']", "header a[href*='order']", "[class*='cart']", "[class*='basket']"]
    pages: [home]
    description: "При добавлении товара в корзину отображается количество и сумма"
    severity: high

  - id: 56
    category: ecommerce
    name: "Корзина — правильный URL"
    check_type: url_exists
    patterns: ["/cart", "/order", "/checkout"]
    pages: [home]
    description: "Адрес корзины должен быть /cart или /order, но не /korzina (Яндекс не распознает)"
    severity: high

  - id: 57
    category: ecommerce
    name: "Оплата через Сбербанк Онлайн"
    check_type: text_contains
    patterns: ["сбербанк", "sberbank", "sberpay", "сберпей"]
    pages: [home, delivery]
    description: "Второй по популярности способ оплаты"
    severity: medium

  - id: 58
    category: ecommerce
    name: "Самовывоз"
    check_type: text_contains
    patterns: ["самовывоз", "pickup", "забрать из магазина", "забрать на складе"]
    pages: [delivery, home]
    description: "Возможность самовывоза"
    severity: medium

  - id: 59
    category: ecommerce
    name: "Адреса сервисных центров"
    check_type: text_contains
    patterns: ["сервисный центр", "сервисные центры", "сервисные точки", "service center"]
    pages: [contacts, home]
    description: "Адреса сервисных центров для клиентов"
    severity: low

  - id: 60
    category: ecommerce
    name: "Информация об оплате (иконки)"
    check_type: element_exists
    patterns: ["[class*='payment'] img", "[class*='pay-systems'] img", "footer img[alt*='visa' i]", "footer img[alt*='mir' i]"]
    pages: [home]
    description: "Дубль иконками и логотипами платежных систем"
    severity: medium

  - id: 61
    category: ecommerce
    name: "Срок доставки"
    check_type: text_contains
    patterns: ["срок доставки", "дн. доставка", "доставим за", "delivery time", "в течение"]
