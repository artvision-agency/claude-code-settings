<!--
Sticky mini-TOC для desktop (≥1024px) с active-highlight + collapse-toggle.
Использование: вставить ПЕРЕД </body> в КП. Заменить TOC_ITEMS на список ссылок.
Источник: na-sklad.ru (2026-05-01).
-->

<style>
.av-mini-toc { display: none; }
@media (min-width: 1024px) {
    .av-mini-toc {
        display: block; position: fixed; top: 24px; right: 24px;
        z-index: 9000; background: rgba(255,255,255,0.96);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border: 1px solid #e5e7eb; border-radius: 10px;
        box-shadow: 0 6px 28px rgba(0,0,0,0.10);
        max-height: calc(100vh - 48px); width: 240px;
        font: 13px/1.45 -apple-system, system-ui, sans-serif; overflow: hidden;
    }
    .av-mini-toc-body { padding: 14px 14px 12px; overflow-y: auto; max-height: calc(100vh - 96px); }
    .av-mini-toc-toggle {
        position: absolute; top: 8px; right: 8px;
        background: transparent; border: none; cursor: pointer;
        color: #6b7280; padding: 4px; opacity: 0;
    }
    .av-mini-toc:hover .av-mini-toc-toggle { opacity: 1; }
    .av-mini-toc.collapsed { width: auto; }
    .av-mini-toc.collapsed .av-mini-toc-body { display: none; }
    .av-mini-toc.collapsed .av-mini-toc-toggle { opacity: 1; position: static; padding: 10px 12px; color: #2c3e88; }
    .av-mini-toc-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6b7280; margin-bottom: 10px; padding-right: 26px; }
    .av-mini-toc-group { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #2c3e88; margin: 12px 0 4px; padding-bottom: 4px; border-bottom: 1.5px solid #2c3e88; }
    .av-mini-toc-group:first-of-type { margin-top: 0; }
    .av-mini-toc-link { display: block; padding: 6px 8px; margin: 0 -8px; color: #1a202c; text-decoration: none; border-radius: 5px; line-height: 1.35; }
    .av-mini-toc-link:hover { background: #f0f6fa; color: #2c3e88; }
    .av-mini-toc-link.active { background: #2c3e88; color: #fff; font-weight: 500; }
}
@media print { .av-mini-toc { display: none !important; } }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
</style>

<aside class="av-mini-toc" id="avMiniToc" aria-label="Навигация по разделам">
  <button type="button" class="av-mini-toc-toggle" id="avMiniTocToggle" aria-expanded="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="av-mini-toc-body" id="avMiniTocBody">
    <div class="av-mini-toc-title">Содержание</div>
    <!-- TOC_ITEMS — формат:
      <div class="av-mini-toc-group">Группа</div>
      <a href="#section-id" class="av-mini-toc-link">Название</a>
    -->
  </div>
</aside>

<script>
(function(){
  var toc = document.getElementById('avMiniToc');
  var toggle = document.getElementById('avMiniTocToggle');
  if (!toc || !toggle) return;
  toggle.addEventListener('click', function(){
    toc.classList.toggle('collapsed');
    toggle.setAttribute('aria-expanded', !toc.classList.contains('collapsed'));
  });
  var links = toc.querySelectorAll('.av-mini-toc-link');
  var sections = [];
  links.forEach(function(a){
    var id = a.getAttribute('href').slice(1);
    var sec = document.getElementById(id);
    if (sec) sections.push({ id: id, link: a, el: sec });
  });
  function update(){
    var top = window.scrollY + 100;
    var current = sections[0];
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].el.offsetTop <= top) current = sections[i];
    }
    links.forEach(function(a){ a.classList.remove('active'); });
    if (current) current.link.classList.add('active');
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('load', update);
  update();
})();
</script>
