[project]
name = "nv-engine"
version = "0.1.0"
description = "Deterministic engine for the narration-to-visuals skill (script-gen stage)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nv_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
