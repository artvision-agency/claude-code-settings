name: api-test

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install schemathesis pytest httpx
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Start API (override for your stack)
        run: |
          # Example: uvicorn app.main:app --port 8000 &
          echo "TODO: start your API here" && sleep 1
      - name: Contract tests
        run: pytest tests/contract -v --run-integration
        continue-on-error: true
        env:
          BASE_URL: http://localhost:8000

  load-k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k && sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Start API (override)
        run: echo "TODO: start your API here"
      - name: Smoke load
        run: k6 run tests/load/k6_script.js
        continue-on-error: true
        env:
          BASE_URL: http://localhost:8000
          K6_VUS: "10"
          K6_DURATION: "15s"

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install pytest httpx
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Auth flow tests
        run: pytest tests/auth -v --run-integration
        continue-on-error: true
        env:
          API_BASE_URL: http://localhost:8000
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
