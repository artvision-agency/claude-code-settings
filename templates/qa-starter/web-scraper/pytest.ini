[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -ra --strict-markers --tb=short
markers =
    unit: pure functions without network
    integration: live-scrape 1-2 URLs (smoke), needs network
    schema: JSONSchema validation of extracted records
    regression: golden-file diff against last known-good run
    stealth: anti-detect checks (headful, SeleniumBase UC mode)
    slow: >5s, skipped by default in CI fast lane
