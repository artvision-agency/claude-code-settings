name: scraper-tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly headful stealth run — Sun 03:00 UTC
    - cron: "0 3 * * 0"

jobs:
  fast:
    name: unit + schema + regression (headless)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [headless]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest tests/unit tests/schema tests/regression -v

  integration:
    name: integration smoke (1-2 live URLs)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest tests/integration -v -m integration

  stealth:
    name: anti-detect (headful, weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run anti-detect in xvfb
        run: xvfb-run -a pytest tests/stealth -v -m stealth --headed
